name: Build, compile, and release both bt and st

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew build
      - name: Collect artifacts
        run: |
          mkdir artifacts
          cp $(find tools/[bs]t/ -name "[bs]t-*.jar") artifacts/
      - name: Upload bt artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: artifacts/bt*.jar
          archive: false
          if-no-files-found: error
      - name: Upload st artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: artifacts/st*.jar
          archive: false
          if-no-files-found: error

  # This is a crude license header check. The ones I tested were susceptible to whitespace differences
  # and I never got them to work. My primary goal is to ensure the headers exist, so this suffices.
  license-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Look for license phrase
        run: |
          outfile=$(mktemp)
          find . -name "*.java" | xargs grep -L "GNU General Public License" > ${outfile}
          if [ -s "${outfile}" ]
          then
            echo "License headers missing on the following files:"
            cat ${outfile}
            exit 1
          else
            echo "License headers appear to be valid!"
          fi

  build-native:
    name: bt and st on ${{ matrix.os }}-${{ matrix.arch }}
    needs: [build-java, license-check]
    runs-on: ${{ matrix.label }}
    strategy:
      matrix:
        # See: https://docs.github.com/en/actions/concepts/runners/about-github-hosted-runners#overview-of-github-hosted-runners
        # ... and follow the links to the related Github repositories
        include:
          - label: ubuntu-latest
            os: linux
            arch: x86_64
          - label: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - label: windows-latest
            os: windows
            arch: x86_64
          - label: macos-15-intel
            os: darwin
            arch: x86_64
          - label: macos-15
            os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'liberica'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
      - name: Build 'bt' and 'st'
        run: ./gradlew nativeCompile
        env:
          # Needed for Windows; not an issue for other OSes
          GRADLE_OPTS: -Djava.io.tmpdir=${{ runner.temp }}
      - name: Run UPX
        uses: crazy-max/ghaction-upx@v4
        with:
          files: |
            tools/bt/build/native/nativeCompile/bt*
            tools/st/build/native/nativeCompile/st*
      - name: Run CLTH tests
        if: ${{ matrix.os != 'windows' }}
        shell: bash
        run: ./scripts/run-clth-tests.sh
      - name: Upload 'bt' binary
        uses: actions/upload-artifact@v7
        with:
          name: bt-${{ matrix.os }}-${{ matrix.arch }}
          path: tools/bt/build/native/nativeCompile/bt*
          archive: false
          if-no-files-found: error
      - name: Upload 'st' binary
        uses: actions/upload-artifact@v7
        with:
          name: st-${{ matrix.os }}-${{ matrix.arch }}
          path: tools/st/build/native/nativeCompile/st*
          archive: false
          if-no-files-found: error

  release:
    name: Create draft release
    if: github.ref_type == 'tag'
    needs: [build-java, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            bt*
            st*
