# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Build bt and st

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build with Gradle
      run: ./gradlew build
    - name: Collect artifacts
      run: |
        mkdir artifacts
        cp $(find tools/ -name "bastools-*.jar" -not -name "bastools-*-plain.jar") artifacts/
    - name: Upload bt artifact
      uses: actions/upload-artifact@v7  
      with:
        name: build-artifacts
        path: artifacts/bastools-tools-bt*.jar
        archive: false
        if-no-files-found: error
    - name: Upload st artifact
      uses: actions/upload-artifact@v7  
      with:
        name: build-artifacts
        path: artifacts/bastools-tools-st*.jar
        archive: false
        if-no-files-found: error
